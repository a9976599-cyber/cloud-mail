name: Sync upstream main

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream without rewriting history and maintain one PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORK_REPO: ${{ github.repository }}
          UPSTREAM_REPO: maillab/cloud-mail
        run: |
          set -euo pipefail
          branch="bot/upstream-main"
          owner="${FORK_REPO%%/*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main:refs/remotes/upstream/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          upstream_sha="$(git rev-parse refs/remotes/upstream/main)"

          if branch_sha="$(git ls-remote --heads origin "refs/heads/${branch}" | cut -f1)" && [[ -n "${branch_sha}" ]]; then
            git fetch --no-tags origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            git switch --create "${branch}" "refs/remotes/origin/${branch}"
            current_sha="$(git rev-parse HEAD)"
            if [[ "${current_sha}" != "${main_sha}" ]] && git merge-base --is-ancestor "${current_sha}" "${main_sha}"; then
              echo "The sync branch is already contained in main; no update is needed."
              exit 0
            fi
          else
            git switch --create "${branch}" "refs/remotes/origin/main"
          fi

          if ! git merge-base --is-ancestor "${main_sha}" HEAD; then
            if ! git merge --no-ff --no-edit "${main_sha}"; then
              git merge --abort || true
              echo "::notice::Fork main conflicts with the sync branch; preserving the remote branch and any open PR for manual resolution."
              exit 0
            fi
          fi

          if ! git merge-base --is-ancestor "${upstream_sha}" HEAD; then
            if ! git merge --no-ff --no-edit "${upstream_sha}"; then
              git merge --abort || true
              echo "::notice::Upstream conflicts with the sync branch; preserving the remote branch and any open PR for manual resolution."
              exit 0
            fi
            git push origin "HEAD:refs/heads/${branch}"
          fi

          ahead_count="$(git rev-list --count "refs/remotes/origin/main..HEAD")"
          if [[ "${ahead_count}" == "0" ]]; then
            echo "Fork main already contains upstream; no empty PR will be created."
            exit 0
          fi

          existing_pr_url="$(gh pr list --repo "${FORK_REPO}" --state open --base main --head "${owner}:${branch}" --json url --jq '.[0].url // ""')"
          if [[ -n "${existing_pr_url}" ]]; then
            echo "Existing upstream sync PR retained and updated: ${existing_pr_url}"
          else
            gh pr create \
              --repo "${FORK_REPO}" \
              --base main \
              --head "${branch}" \
              --title "Sync upstream main" \
              --body "Automated merge of ${UPSTREAM_REPO}:main into this fork. This PR is never auto-merged. Updates use merge commits and never reset or force-push main. If an upstream merge conflicts, the bot branch is left unchanged for manual resolution."
          fi
